<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CMS Certificate Portal{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Calibri', 'Segoe UI', 'Helvetica', sans-serif;
    background: linear-gradient(135deg, #eef3fa 0%, #f7f9fc 100%);
    color: #151515;
    margin: 0;
    min-height: 100vh;
  }
  .topnav {
    background: #ffffff;
    border-bottom: 1px solid #dce4ee;
    box-shadow: 0 2px 10px rgba(34, 94, 159, 0.06);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .nav-inner {
    max-width: 1000px;
    margin: 0 auto;
    padding: .9em 1.5em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .75em;
  }
  .brand {
    color: #225E9F;
    font-weight: 700;
    font-size: 17px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: .5em;
  }
  .brand .badge {
    background: #225E9F;
    color: #fff;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }
  .nav-links { display: flex; gap: .5em; }
  .nav-links a {
    color: #33465c;
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 600;
    padding: .5em .9em;
    border-radius: 7px;
    transition: background .15s ease, color .15s ease;
  }
  .nav-links a:hover { background: #eef4fb; color: #225E9F; }
  .nav-links a.active { background: #225E9F; color: #fff; }
  main { padding: 2.5em 1.5em; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
  <nav class="topnav">
    <div class="nav-inner">
      <a class="brand" href="/"><span class="badge">CMS</span> Certificate Portal</a>
      <div class="nav-links">
        <a href="/" class="{{ 'active' if active == 'home' else '' }}">Home</a>
        <a href="/search" class="{{ 'active' if active == 'search' else '' }}">Email Search</a>
      </div>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
